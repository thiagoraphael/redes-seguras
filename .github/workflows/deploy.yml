name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: |
          npm ci
          # Contorna um bug do npm com dependências opcionais (npm/cli#4828): se o binário
          # nativo do compilador do Astro não veio, instala a versão que está no lockfile.
          BIN=@astrojs/compiler-binding-linux-x64-gnu
          if ! node -e "require('$BIN')" 2>/dev/null; then
            VERSAO=$(node -p "require('./package-lock.json').packages['node_modules/$BIN'].version")
            echo "Binário nativo ausente, instalando $BIN@$VERSAO"
            npm install --no-save "$BIN@$VERSAO"
          fi
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # https://USUARIO.github.io/REPOSITORIO/
          # Com domínio próprio, troque BASE_PATH para "/" e SITE_URL para o seu domínio.
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
